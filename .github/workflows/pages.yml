name: Nihongo Path — GitHub Pages

# Deploy validated static website from develop to GitHub Pages.
# Source is public and Pages is configured for GitHub Actions.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nihongopath-pages-release-v118
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout one source
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Home PIN JavaScript syntax
        run: node --check source/public/family-demo-auth.js && node --check source/public/login-ui.js && node --check source/public/family-pin-ui.js && node --check source/public/i18n/ui-pack.js && node --check source/public/locales.js && node --check source/public/locale-coverage.js && node --check source/public/lesson-locale.js && node --check source/public/foundation-locale.js && node --check source/public/season-system.js && node --check source/public/lesson-ui.js && node --check source/public/foundation-curriculum-v33.js && node --check source/public/foundation-course-v33.js && node --check source/public/app.js && node --check source/public/kana-studio.js && node --check source/public/foundation-journey.js
      - name: Validate Home V2 and typography regressions
        run: node --test tests/readability.test.mjs tests/home-v2.test.mjs tests/family-static-demo.test.mjs tests/horizon-brand.test.mjs tests/home-v4.test.mjs tests/home-v5.test.mjs tests/home-v6-mobile.test.mjs tests/home-v7.test.mjs tests/home-v8.test.mjs tests/home-v9.test.mjs tests/home-v10.test.mjs tests/home-v11.test.mjs tests/season-shell.test.mjs tests/i18n-consistency.test.mjs tests/i18n-authored-content.test.mjs tests/i18n-v15-regression.test.mjs tests/i18n-ui-pack.test.mjs tests/i18n-v17-pages.test.mjs tests/foundation-journey.test.mjs tests/lesson-compact.test.mjs tests/lesson-mockup-v20.test.mjs tests/foundation-n5-next.test.mjs tests/foundation-course-v33.test.mjs
      - name: Build static Nihongo Path for GitHub Pages
        run: |
          unset NP_FAMILY_SYNC_BUILD
          node scripts/build-site.cjs
      - name: Ensure no server D1 adapter is shipped as active mode
        run: |
          if grep -q 'window.NP_FAMILY_SYNC=true' dist/site/index.html; then
            echo 'Unexpected backend mode in static GitHub Pages build' >&2
            exit 1
          fi
          test -f dist/site/index.html
          test -f dist/site/kana-studio.js
          test -f dist/site/foundation-journey.js
          test -f dist/site/lesson-compact.css
          test -f dist/site/lesson-mockup.css
          test -f dist/site/assets/lesson-sakura-branch.svg
          test -f dist/site/assets/lesson-enso-sakura.svg
      - name: Verify HORIZON v1.43 artifact and stamp release
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,existsSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const html=readFileSync('dist/site/index.html','utf8');
          const js=readFileSync('dist/site/app.js','utf8');
          assert.match(js,/>v1\.43<\/small>/,'UI logo version must be v1.43');
          for(const name of ['result-v142.css','progress-v143.css','foundation-course-v33.js','learning-hub-v25.js']){
            assert.ok(existsSync('dist/site/'+name),'Missing asset: '+name);
            assert.ok(html.includes(name+'?v='),'Unversioned asset in published HTML: '+name);
          }
          assert.ok(!html.includes('window.NP_FAMILY_SYNC=true;'),'GitHub Pages must stay static demo');
          const manifest={version:'v1.43',commit:process.env.SOURCE_COMMIT,branch:'develop',
            platform:'github-pages',site:'NihongoPath'};
          writeFileSync('dist/site/release.json',JSON.stringify(manifest,null,2)+'\n');
          console.log('PAGES_RELEASE',JSON.stringify(manifest));
          NODE
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload validated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Pages release is current
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url='https://dqhuy1982-stack.github.io/NihongoPath/release.json?sha='+process.env.SOURCE_COMMIT;
          let last='';
          for(let i=0;i<12;i++){
            try{
              const response=await fetch(url,{headers:{'Cache-Control':'no-cache'}});
              if(!response.ok)throw Error('HTTP '+response.status);
              const release=await response.json();
              if(release.commit===process.env.SOURCE_COMMIT&&release.version==='v1.43'){
                console.log('PUBLISHED_AND_VERIFIED',JSON.stringify(release));
                process.exit(0);
              }
              last='Expected '+process.env.SOURCE_COMMIT+' v1.43, got '+JSON.stringify(release);
            }catch(error){last=String(error)}
            await new Promise(r=>setTimeout(r,5000));
          }
          throw Error('GitHub Pages served stale or missing release: '+last+
            '. Check Settings > Pages > Source = GitHub Actions, and successful deploy job.');
          NODE
