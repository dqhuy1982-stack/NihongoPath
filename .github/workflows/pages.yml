name: Nihongo Path — GitHub Pages

# Deploy validated static website from develop to GitHub Pages.
# Source is public and Pages is configured for GitHub Actions.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nihongopath-pages-release-v118
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout one source
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Home PIN JavaScript syntax
        run: node --check source/public/family-demo-auth.js && node --check source/public/login-ui.js && node --check source/public/family-pin-ui.js && node --check source/public/i18n/ui-pack.js && node --check source/public/locales.js && node --check source/public/locale-coverage.js && node --check source/public/lesson-locale.js && node --check source/public/foundation-locale.js && node --check source/public/season-system.js && node --check source/public/lesson-ui.js && node --check source/public/foundation-curriculum-v33.js && node --check source/public/foundation-course-v33.js && node --check source/public/app.js && node --check source/public/kana-studio.js && node --check source/public/foundation-journey.js && node --check source/public/n5-path-v145.js && node --check source/public/n5-lesson01-data-v146.js && node --check source/public/n5-lesson01-context-v147.js && node --check source/public/n5-character-world-v148.js && node --check source/public/n5-lesson01-v146.js
      - name: Validate Home V2 and typography regressions
        run: node --test tests/readability.test.mjs tests/home-v2.test.mjs tests/family-static-demo.test.mjs tests/horizon-brand.test.mjs tests/home-v4.test.mjs tests/home-v5.test.mjs tests/home-v6-mobile.test.mjs tests/home-v7.test.mjs tests/home-v8.test.mjs tests/home-v9.test.mjs tests/home-v10.test.mjs tests/home-v11.test.mjs tests/season-shell.test.mjs tests/i18n-consistency.test.mjs tests/i18n-authored-content.test.mjs tests/i18n-v15-regression.test.mjs tests/i18n-ui-pack.test.mjs tests/i18n-v17-pages.test.mjs tests/foundation-journey.test.mjs tests/lesson-compact.test.mjs tests/lesson-mockup-v20.test.mjs tests/foundation-n5-next.test.mjs tests/foundation-course-v33.test.mjs tests/n5-path-v145.test.mjs tests/n5-lesson01-v146.test.mjs tests/n5-character-world-v148.test.mjs
      - name: Build static Nihongo Path for GitHub Pages
        run: |
          unset NP_FAMILY_SYNC_BUILD
          node scripts/build-site.cjs
      - name: Ensure no server D1 adapter is shipped as active mode
        run: |
          if grep -q 'window.NP_FAMILY_SYNC=true' dist/site/index.html; then
            echo 'Unexpected backend mode in static GitHub Pages build' >&2
            exit 1
          fi
          test -f dist/site/index.html
          test -f dist/site/kana-studio.js
          test -f dist/site/foundation-journey.js
          test -f dist/site/lesson-compact.css
          test -f dist/site/lesson-mockup.css
          test -f dist/site/n5-path-v145.js
          test -f dist/site/n5-path-v145.css
          test -f dist/site/n5-lesson01-data-v146.js
          test -f dist/site/n5-lesson01-v146.js
          test -f dist/site/n5-lesson01-v146.css
          test -f dist/site/n5-lesson01-context-v147.js
          test -f dist/site/n5-lesson01-context-v147.css
          test -f dist/site/n5-character-world-v148.js
          test -f dist/site/n5-character-world-v148.css
          test -f dist/site/assets/lesson-sakura-branch.svg
          test -f dist/site/assets/lesson-enso-sakura.svg
      - name: Verify HORIZON v1.48 artifact and stamp release
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,existsSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const html=readFileSync('dist/site/index.html','utf8');
          const js=readFileSync('dist/site/app.js','utf8');
          assert.match(js,/>v1\.48<\/small>/,'UI logo version must be v1.48');
          for(const name of ['result-v142.css','progress-v143.css','foundation-course-v33.js','learning-hub-v25.js','n5-path-v145.css','n5-path-v145.js','n5-lesson01-data-v146.js','n5-lesson01-v146.js','n5-lesson01-v146.css','n5-lesson01-context-v147.js','n5-lesson01-context-v147.css','n5-character-world-v148.js','n5-character-world-v148.css']){
            assert.ok(existsSync('dist/site/'+name),'Missing asset: '+name);
            assert.ok(html.includes(name+'?v='),'Unversioned asset in published HTML: '+name);
          }
          assert.ok(!html.includes('window.NP_FAMILY_SYNC=true;'),'GitHub Pages must stay static demo');
          const manifest={version:'v1.48',commit:process.env.SOURCE_COMMIT,branch:'develop',
            platform:'github-pages',site:'NihongoPath'};
          writeFileSync('dist/site/release.json',JSON.stringify(manifest,null,2)+'\n');
          console.log('PAGES_RELEASE',JSON.stringify(manifest));
          NODE
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload validated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Pages release is current
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url='https://dqhuy1982-stack.github.io/NihongoPath/release.json?sha='+process.env.SOURCE_COMMIT;
          let last='';
          for(let i=0;i<12;i++){
            try{
              const response=await fetch(url,{headers:{'Cache-Control':'no-cache'}});
              if(!response.ok)throw Error('HTTP '+response.status);
              const release=await response.json();
              if(release.commit===process.env.SOURCE_COMMIT&&release.version==='v1.48'){
                const base='https://dqhuy1982-stack.github.io/NihongoPath/';
                const pageResponse=await fetch(base+'?verify='+process.env.SOURCE_COMMIT,{headers:{'Cache-Control':'no-cache'}});
                if(!pageResponse.ok)throw Error('Published HTML HTTP '+pageResponse.status);
                const html=await pageResponse.text();
                assert.match(html,/src="app\.js\?v=148"/,'Published HTML still references old app.js');
                assert.match(html,/progress-v143\.css\?v=143/,'Published HTML lacks progress styles');
                const scriptResponse=await fetch(base+'app.js?v=148',{headers:{'Cache-Control':'no-cache'}});
                if(!scriptResponse.ok)throw Error('Published app.js HTTP '+scriptResponse.status);
                const app=await scriptResponse.text();
                assert.ok(app.includes('>v1.48</small>'),'Published app.js still shows old logo version');
                const liveAssets=[
                  ['learning-hub-v25.js?v=146', "const lessonAction=mode=>'#'+engine.path(m.id,unit.id,mode,script);"],
                  ['foundation-course-v33.js?v=146', "const routeMode=mode=>'#'+path(cfg.id,cfg.group,mode,nativeScript);"]
                ];
                for(const [file,expected] of liveAssets){
                  const response=await fetch(base+file,{headers:{'Cache-Control':'no-cache'}});
                  if(!response.ok)throw Error('Published '+file+' HTTP '+response.status);
                  const script=await response.text();
                  assert.ok(script.includes(expected),'Published '+file+' is missing direct lesson route');
                }
                console.log('LIVE_LESSON_ROUTES_VERIFIED',JSON.stringify({version:'v1.48',
                  scripts:liveAssets.map(([file])=>file),commit:process.env.SOURCE_COMMIT}));
                assert.match(html,/n5-path-v145\.css\?v=146/,'Published HTML has no N5 design stylesheet');
                assert.match(html,/src="n5-path-v145\.js\?v=146"/,'Published HTML lacks N5 route adapter');
                const n5Response=await fetch(base+'n5-path-v145.js?v=146',{headers:{'Cache-Control':'no-cache'}});
                if(!n5Response.ok)throw Error('Published N5 router HTTP '+n5Response.status);
                const n5Js=await n5Response.text();
                assert.ok(n5Js.includes('Học N5, từng bài một.'),'Published N5 route has no 25-lesson landing');
                assert.ok(n5Js.includes("coursePage=function(id){return id==='N5'?page():previousCourse(id)}"),
                 'Published N5 script does not intercept #course/N5');
                console.log('LIVE_N5_PATH_VERIFIED',JSON.stringify({version:'v1.48',commit:process.env.SOURCE_COMMIT}));
                assert.match(html,/n5-lesson01-v146\.css\?v=146/,'Published Lesson 01 stylesheet missing');
                assert.match(html,/src="n5-lesson01-data-v146\.js\?v=146"/,'Published Lesson 01 content missing');
                assert.match(html,/src="n5-lesson01-v146\.js\?v=148"/,'Published Lesson 01 controller missing');
                const lessonJs=await fetch(base+'n5-lesson01-v146.js?v=148',{headers:{'Cache-Control':'no-cache'}});
                const lessonData=await fetch(base+'n5-lesson01-data-v146.js?v=146',{headers:{'Cache-Control':'no-cache'}});
                if(!lessonJs.ok||!lessonData.ok)throw Error('Published Lesson 01 assets returned HTTP errors');
                const lessonSource=await lessonJs.text(),dataSource=await lessonData.text();
                assert.ok(lessonSource.includes("id==='N5'&&here==='course/N5/lesson/01'"),
                 'Published Lesson 01 does not handle deep link');
                assert.ok(lessonSource.includes('listeningVerified:'),'Published Lesson 01 lacks listening validation');
                assert.ok(dataSource.includes('"id": "n5-minna-l01"'),
                 'Published Lesson 01 content ID missing');
                assert.match(html,/n5-lesson01-context-v147\.css\?v=147/,'Published scenario stylesheet missing');
                assert.match(html,/src="n5-lesson01-context-v147\.js\?v=148"/,'Published scenario content not referenced');
                const contextResponse=await fetch(base+'n5-lesson01-context-v147.js?v=148',{headers:{'Cache-Control':'no-cache'}});
                if(!contextResponse.ok)throw Error('Published scenario module HTTP '+contextResponse.status);
                const contextScript=await contextResponse.text();
                for(const id of ['meeting','colleague','correcting','classmates']){
                  assert.ok(contextScript.includes('"id": "'+id+'"'),'Published scenario '+id+' missing');
                }
                assert.ok(lessonSource.includes('function scenePage()'),'Published controller has no scene renderer');
                assert.ok(lessonSource.includes('chooseSceneAnswer'),'Published controller has no in-context practice action');
                console.log('LIVE_N5_CONTEXT_VERIFIED',JSON.stringify({version:'v1.48',
                 scenarios:4,commit:process.env.SOURCE_COMMIT}));
                console.log('LIVE_N5_LESSON01_VERIFIED',JSON.stringify({version:'v1.48',
                  assets:['n5-lesson01-v146.js','n5-lesson01-data-v146.js'],commit:process.env.SOURCE_COMMIT}));
                assert.match(html,/n5-character-world-v148\.css\?v=148/,'Character world styles missing from published HTML');
                assert.match(html,/src="n5-character-world-v148\.js\?v=148"/,'Character world script missing from published HTML');
                const worldResponse=await fetch(base+'n5-character-world-v148.js?v=148',{headers:{'Cache-Control':'no-cache'}});
                if(!worldResponse.ok)throw Error('Published character world HTTP '+worldResponse.status);
                const worldSource=await worldResponse.text();
                for(const marker of ['function hero(scene)','function profile(id)','function annotate(value,selectedId)','window.NPN5CharacterWorld']){
                  assert.ok(worldSource.includes(marker),'Missing character-world code: '+marker);
                }
                assert.ok(lessonSource.includes('WORLD?WORLD.hero(scene)'),'Lesson controller is not using illustrated contexts');
                assert.ok(lessonSource.includes('WORLD.profile(activeCharacter)'),'Character popup is not connected');
                console.log('LIVE_N5_WORLD_VERIFIED',JSON.stringify({version:'v1.48',commit:process.env.SOURCE_COMMIT}));
                console.log('PUBLISHED_AND_VERIFIED',JSON.stringify(release));
                console.log('LIVE_HTML_AND_APP_VERIFIED',JSON.stringify({version:'v1.48',
                  appScript:'app.js?v=148',site:base,commit:process.env.SOURCE_COMMIT}));
                process.exit(0);
              }
              last='Expected '+process.env.SOURCE_COMMIT+' v1.48, got '+JSON.stringify(release);
            }catch(error){last=String(error)}
            await new Promise(r=>setTimeout(r,5000));
          }
          throw Error('GitHub Pages served stale or missing release: '+last+
            '. Check Settings > Pages > Source = GitHub Actions, and successful deploy job.');
          NODE
