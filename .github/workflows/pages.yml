name: Nihongo Path — GitHub Pages

# Deploy validated static website from develop to GitHub Pages.
# Source is public and Pages is configured for GitHub Actions.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nihongopath-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout one source
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Home PIN JavaScript syntax
        run: node --check source/public/family-demo-auth.js && node --check source/public/login-ui.js && node --check source/public/family-pin-ui.js
      - name: Validate Home V2 and typography regressions
        run: node --test tests/readability.test.mjs tests/home-v2.test.mjs tests/family-static-demo.test.mjs
      - name: Build static Nihongo Path for GitHub Pages
        run: |
          unset NP_FAMILY_SYNC_BUILD
          node scripts/build-site.cjs
      - name: Ensure no server D1 adapter is shipped as active mode
        run: |
          if grep -q 'window.NP_FAMILY_SYNC=true' dist/site/index.html; then
            echo 'Unexpected backend mode in static GitHub Pages build' >&2
            exit 1
          fi
          test -f dist/site/index.html
          test -f dist/site/kana-studio.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload validated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
