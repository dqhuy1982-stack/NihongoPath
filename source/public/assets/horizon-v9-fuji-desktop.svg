<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
<defs>
 <linearGradient id="fuji" x1=".24" y1=".02" x2=".66" y2=".97">
  <stop offset="0" stop-color="#f4f7f4" stop-opacity=".98"/>
  <stop offset=".27" stop-color="#cbd9d5" stop-opacity=".68"/>
